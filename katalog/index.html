<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Katalog — Yaffle Woods</title>
<meta name="description" content="Yaffle Woods Ürün Kataloğu">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --green-950: #0d1f0e;
    --green-900: #132815;
    --green-800: #1c3d1f;
    --green-600: #2e6732;
    --cream: #f5ede0;
    --wood: #c4956a;
    --wood-light: #d4aa84;
    --text-light: #f0ece4;
    --text-muted: #a8b8aa;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }

  body {
    background: var(--green-950);
    color: var(--text-light);
    font-family: 'Jost', sans-serif;
    font-weight: 300;
    overflow-x: hidden;
  }

  .tr, .en { display: none; }
  body.lang-tr .tr { display: inline; }
  body.lang-en .en { display: inline; }

  .nav-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 70px;
    background: rgba(13, 31, 14, 0.9);
    backdrop-filter: blur(10px);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 40px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    z-index: 100;
  }

  .back-btn {
    color: var(--cream);
    text-decoration: none;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: color 0.2s;
  }

  .back-btn:hover {
    color: var(--wood-light);
  }

  .nav-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: 20px;
    font-weight: 500;
    color: var(--cream);
    letter-spacing: 0.05em;
  }

  .nav-title span { color: var(--wood); }

  .lang-bar {
    display: flex;
  }
  .lang-btn {
    background: none;
    border: 1px solid rgba(255,255,255,0.15);
    color: var(--text-muted);
    font-family: 'Jost', sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    padding: 4px 10px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .lang-btn:first-child { border-radius: 4px 0 0 4px; }
  .lang-btn:last-child { border-radius: 0 4px 4px 0; border-left: none; }
  .lang-btn.active {
    background: var(--green-600);
    border-color: var(--green-600);
    color: var(--text-light);
  }

  .katalog-section {
    padding: 120px 20px 60px;
    max-width: 800px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 40px;
  }

  .katalog-intro {
    text-align: center;
    margin-bottom: 20px;
  }

  .katalog-intro h1 {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(32px, 5vw, 48px);
    font-weight: 500;
    color: var(--cream);
    margin-bottom: 12px;
  }

  .katalog-intro h1 em {
    font-style: italic;
    color: var(--wood-light);
  }

  .katalog-intro p {
    font-size: 14px;
    color: var(--text-muted);
    max-width: 500px;
    margin: 0 auto;
    line-height: 1.6;
  }

  .page-container {
    width: 100%;
    position: relative;
    background: var(--green-900);
    border: 1px solid rgba(196,149,106,0.15);
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    aspect-ratio: 1747 / 2482;
  }

  .page-container img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .page-number {
    position: absolute;
    bottom: 15px;
    right: 20px;
    background: rgba(13, 31, 14, 0.75);
    color: var(--text-muted);
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 3px;
    letter-spacing: 0.1em;
  }

  .katalog-footer {
    text-align: center;
    margin-top: 40px;
    padding-top: 30px;
    border-top: 1px solid rgba(255,255,255,0.06);
    width: 100%;
  }

  .pdf-download-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 12px 28px;
    border: 1.5px solid var(--green-600);
    color: var(--cream);
    text-decoration: none;
    font-size: 12px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    border-radius: 2px;
    transition: all 0.25s;
    margin-bottom: 24px;
  }

  .pdf-download-btn:hover {
    background: var(--green-600);
  }

  .copyright {
    font-size: 11px;
    color: var(--green-600);
  }

  @media (max-width: 768px) {
    .nav-bar { padding: 0 20px; }
    .katalog-section { padding-top: 100px; }
  }
</style>
</head>
<body class="lang-tr">

<div class="nav-bar">
  <a href="../" class="back-btn">
    ← <span class="tr">Ana Sayfa</span><span class="en">Home</span>
  </a>

  <div class="nav-title">Yaffle <span>Woods</span></div>

  <div class="lang-bar">
    <button class="lang-btn active" onclick="setLang('tr')">TR</button>
    <button class="lang-btn" onclick="setLang('en')">EN</button>
  </div>
</div>

<div class="katalog-section">
  
  <div class="katalog-intro">
    <h1>
      <span class="tr">Ürün <em>Kataloğu</em></span>

    </h1>
    <p>
      <span class="tr">El emeği ahşap tasarımlarımızı ve koleksiyonumuzu detaylıca inceleyin.</span>
      <span class="en">Explore our handcrafted wooden designs and collection in detail.</span>
    </p>
  </div>

  
  <div class="page-container">
    <img src="assets/sayfa-1.webp" alt="Katalog Sayfa 1" loading="lazy">

  </div>

  <div class="page-container">

  <div class="page-container">

  </div>

  <div class="page-container">
    <img src="assets/sayfa-4.webp" alt="Katalog Sayfa 4" loading="lazy">
    <div class="page-number">04</div>
  </div>

  <div class="page-container">
    <img src="assets/sayfa-5.webp" alt="Katalog Sayfa 5" loading="lazy">
    <div class="page-number">05</div>
  </div>

  <div class="page-container">
    <img src="assets/sayfa-6.webp" alt="Katalog Sayfa 6" loading="lazy">

  </div>

  <div class="page-container">
    <img src="assets/sayfa-7.webp" alt="Katalog Sayfa 7" loading="lazy">

  </div>

  <div class="page-container">
    <img src="assets/sayfa-8.webp" alt="Katalog Sayfa 8" loading="lazy">
    <div class="page-number">08</div>
  </div>

  <div class="page-container">
    <img src="assets/sayfa-9.webp" alt="Katalog Sayfa 9" loading="lazy">

  <div class="page-container">
    <img src="assets/sayfa-10.webp" alt="Katalog Sayfa 10" loading="lazy">

  <div class="page-container">
    <img src="assets/sayfa-11.webp" alt="Katalog Sayfa 11" loading="lazy">
    <div class="page-number">11</div>
  </div>

  <div class="katalog-footer">
    <a href="assets/katalog.pdf" download class="pdf-download-btn">
      <span class="tr">PDF Olarak İndir</span>
      <span class="en">Download as PDF</span>
    </a>
    <p class="copyright">© 2026 Yaffle Woods</p>
  </div>

</div>

<script>
  function setLang(lang) {
    document.body.className = 'lang-' + lang;
    document.documentElement.lang = lang;
    document.querySelectorAll('.lang-btn').forEach((btn, i) => {
      btn.classList.toggle('active', (i === 0 && lang === 'tr') || (i === 1 && lang === 'en'));
    });
  }
</script>
</body>
</html>
